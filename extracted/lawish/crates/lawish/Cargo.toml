[package]
name = "lawish"
version.workspace = true
edition.workspace = true
authors.workspace = true
license.workspace = true
description = "lawish — stable, repo-agnostic public API for the Wish-to-System engine: parse a wish, observe any workspace, render it as a layered hypercube, measure realization, plan closure toward 100% DoD, and (optionally) condense system structure into a certified diamond core."
repository.workspace = true
homepage.workspace = true
readme.workspace = true
keywords.workspace = true
categories.workspace = true
rust-version.workspace = true

[features]
default = []
# L9 condensation machine (CDK / CoffinDragger / Diamond). Pulls the vendored
# pse-metatron MPK oracle (nalgebra + rayon) transitively via kosmo-wings.
cdk = ["dep:kosmo-coffindragger", "dep:kosmo-cdk-core", "dep:kosmo-wings"]

[dependencies]
kosmo-core        = { path = "../kosmo-core", version = "0.1.0" }
kosmo-intent      = { path = "../kosmo-intent", version = "0.1.0" }
kosmo-hyphae      = { path = "../kosmo-hyphae", version = "0.1.0" }
kosmo-pipeline    = { path = "../kosmo-pipeline", version = "0.1.0" }
kosmo-synthesizer = { path = "../kosmo-synthesizer", version = "0.1.0" }
kosmo-materialize = { path = "../kosmo-materialize", version = "0.1.0" }
kosmo-systemcube  = { path = "../kosmo-systemcube", version = "0.1.0" }
kosmo-agent       = { path = "../kosmo-agent", version = "0.1.0" }
kosmo-pse-bridge  = { path = "../kosmo-pse-bridge", version = "0.1.0" }
# CDK (optional, behind the `cdk` feature)
kosmo-coffindragger = { path = "../kosmo-coffindragger", version = "0.1.0", optional = true }
kosmo-cdk-core      = { path = "../kosmo-cdk-core", version = "0.1.0", optional = true }
kosmo-wings         = { path = "../kosmo-wings", version = "0.1.0", optional = true }
